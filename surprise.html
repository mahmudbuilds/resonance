<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A small signal</title>
  <style>
    :root {
      --paper: #f8f3e6;
      --ink: #151412;
      --red: #d9412e;
      --blue: #1463a5;
      --green: #16855a;
      --gold: #d49b2a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(21, 20, 18, .05) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(rgba(21, 20, 18, .05) 1px, transparent 1px) 0 0 / 64px 64px,
        radial-gradient(circle at 20% 24%, rgba(217, 65, 46, .20), transparent 24rem),
        radial-gradient(circle at 84% 70%, rgba(20, 99, 165, .22), transparent 26rem),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image:
        repeating-radial-gradient(circle at 20% 40%, rgba(21, 20, 18, .28) 0 1px, transparent 1px 6px);
      mix-blend-mode: multiply;
    }

    .stage {
      position: relative;
      width: min(92vw, 980px);
      height: min(78vh, 640px);
      min-height: 520px;
      border: 2px solid var(--ink);
      background: rgba(248, 243, 230, .84);
      box-shadow: 18px 18px 0 var(--ink);
      overflow: hidden;
      isolation: isolate;
    }

    .rail {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(21, 20, 18, .36);
    }

    .orbital {
      position: absolute;
      inset: 8%;
      border: 2px solid var(--ink);
      border-radius: 50%;
      animation: breathe 5s ease-in-out infinite;
    }

    .orbital::before,
    .orbital::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border: 2px solid var(--ink);
      background: var(--red);
      border-radius: 50%;
      box-shadow: 6px 6px 0 var(--ink);
      animation: travel 7s linear infinite;
      transform-origin: 400px 230px;
    }

    .orbital::after {
      background: var(--blue);
      animation-delay: -3.5s;
    }

    .message {
      position: absolute;
      left: clamp(28px, 8vw, 92px);
      right: clamp(28px, 9vw, 120px);
      top: 50%;
      transform: translateY(-48%);
      z-index: 2;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 12px;
      border: 2px solid var(--ink);
      background: var(--gold);
      font: 700 12px/1.1 "Courier New", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 5px 5px 0 var(--ink);
    }

    h1 {
      max-width: 760px;
      margin: 26px 0 0;
      font-size: clamp(54px, 10vw, 118px);
      line-height: .84;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .note {
      max-width: 620px;
      margin: 24px 0 0;
      font: 18px/1.45 "Courier New", monospace;
    }

    .console {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      align-items: end;
      z-index: 3;
    }

    .meter {
      height: 68px;
      border: 2px solid var(--ink);
      background:
        linear-gradient(to top, var(--green) var(--fill), transparent 0),
        rgba(248, 243, 230, .95);
      box-shadow: 4px 4px 0 var(--ink);
      animation: jump 1.8s ease-in-out infinite;
      animation-delay: calc(var(--i) * -130ms);
    }

    .stamp {
      position: absolute;
      right: 44px;
      top: 38px;
      width: 128px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px dashed var(--ink);
      border-radius: 50%;
      background: rgba(248, 243, 230, .88);
      color: var(--red);
      font: 800 18px/1 "Courier New", monospace;
      text-transform: uppercase;
      transform: rotate(12deg);
      animation: stamp 900ms cubic-bezier(.2, 1.4, .2, 1) both;
    }

    .ticker {
      position: absolute;
      left: -20px;
      right: -20px;
      bottom: 118px;
      padding: 12px 0;
      border-block: 2px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      font: 700 13px/1 "Courier New", monospace;
      white-space: nowrap;
      transform: rotate(-2deg);
      z-index: 1;
    }

    .ticker span {
      display: inline-block;
      min-width: 100%;
      animation: ticker 18s linear infinite;
    }

    button {
      position: absolute;
      right: 42px;
      bottom: 40px;
      z-index: 4;
      width: 74px;
      height: 74px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--red);
      color: var(--paper);
      box-shadow: 7px 7px 0 var(--ink);
      cursor: pointer;
      font: 800 12px/1 "Courier New", monospace;
      text-transform: uppercase;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translate(3px, 3px);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .burst {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .burst.fly {
      animation: pop 760ms ease-out forwards;
    }

    @keyframes breathe {
      50% {
        transform: scale(.94) rotate(7deg);
      }
    }

    @keyframes travel {
      from {
        transform: rotate(0deg) translateX(43vw) rotate(0deg);
      }
      to {
        transform: rotate(360deg) translateX(43vw) rotate(-360deg);
      }
    }

    @keyframes jump {
      0%, 100% {
        transform: scaleY(.44);
      }
      45% {
        transform: scaleY(1);
      }
    }

    @keyframes stamp {
      from {
        opacity: 0;
        transform: scale(1.6) rotate(36deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(12deg);
      }
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    @keyframes pop {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(.2);
      }
    }

    @media (max-width: 680px) {
      .stage {
        height: 86vh;
        min-height: 560px;
        box-shadow: 10px 10px 0 var(--ink);
      }

      .stamp {
        width: 88px;
        right: 22px;
        top: 22px;
        font-size: 13px;
      }

      .message {
        top: 44%;
      }

      .console {
        grid-template-columns: repeat(6, 1fr);
        right: 92px;
      }

      .meter {
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Animated surprise postcard">
    <div class="rail"></div>
    <div class="orbital"></div>
    <div class="stamp">delivered</div>
    <section class="message">
      <div class="kicker">incoming from codex</div>
      <h1>You have excellent timing.</h1>
      <p class="note">A fresh little browser artifact, assembled locally, humming in the corner of the machine.</p>
    </section>
    <div class="ticker" aria-hidden="true">
      <span>signal found / curiosity intact / tiny page alive / press the red button / signal found / curiosity intact / tiny page alive / press the red button / </span>
    </div>
    <div class="console" aria-hidden="true">
      <div class="meter" style="--i:1;--fill:72%"></div>
      <div class="meter" style="--i:2;--fill:41%"></div>
      <div class="meter" style="--i:3;--fill:88%"></div>
      <div class="meter" style="--i:4;--fill:54%"></div>
      <div class="meter" style="--i:5;--fill:96%"></div>
      <div class="meter" style="--i:6;--fill:63%"></div>
      <div class="meter" style="--i:7;--fill:34%"></div>
      <div class="meter" style="--i:8;--fill:79%"></div>
      <div class="meter" style="--i:9;--fill:48%"></div>
      <div class="meter" style="--i:10;--fill:90%"></div>
      <div class="meter" style="--i:11;--fill:57%"></div>
      <div class="meter" style="--i:12;--fill:84%"></div>
    </div>
    <button type="button" id="surprise">ping</button>
  </main>
  <script>
    const stage = document.querySelector(".stage");
    const button = document.querySelector("#surprise");
    const colors = ["#d9412e", "#1463a5", "#16855a", "#d49b2a", "#151412"];

    function burst() {
      const box = button.getBoundingClientRect();
      const root = stage.getBoundingClientRect();
      const originX = box.left + box.width / 2 - root.left;
      const originY = box.top + box.height / 2 - root.top;

      for (let i = 0; i < 28; i += 1) {
        const spark = document.createElement("i");
        const angle = (Math.PI * 2 * i) / 28;
        const distance = 80 + Math.random() * 120;
        spark.className = "burst";
        spark.style.left = `${originX}px`;
        spark.style.top = `${originY}px`;
        spark.style.background = colors[i % colors.length];
        spark.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        spark.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
        stage.appendChild(spark);
        requestAnimationFrame(() => spark.classList.add("fly"));
        setTimeout(() => spark.remove(), 820);
      }
    }

    button.addEventListener("click", burst);
    window.setTimeout(burst, 700);
  </script>
</body>
</html>
